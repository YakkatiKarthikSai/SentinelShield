[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinelshield"
version = "0.1.0"
description = "Educational rule-based WAF/IDS and security-event monitoring prototype"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1",
    "streamlit>=1.39,<2",
    "uvicorn>=0.30,<1",
]

[project.scripts]
sentinelshield-demo = "sentinelshield.cli:main"
sentinelshield-evaluate = "sentinelshield.evaluation:main"
sentinelshield-export = "sentinelshield.reporting:main"
sentinelshield-simulate = "sentinelshield.simulation:main"

[tool.setuptools.packages.find]
include = ["sentinelshield*"]

[tool.vercel]
entrypoint = "sentinelshield.api:app"